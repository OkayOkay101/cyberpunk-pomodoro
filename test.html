<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERPUNK POMODORO // UNIT TEST DASHBOARD</title>
  <style>
    :root {
      --bg: #070913;
      --panel: #0d1224;
      --border: #1f294d;
      --cyan: #00f0ff;
      --green: #00ff66;
      --pink: #ff0055;
      --text: #e2edff;
      --text-dim: #8fa2c4;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Courier New', monospace;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .test-container {
      width: 100%;
      max-width: 700px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-top: 3px solid var(--cyan);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 25px rgba(0, 240, 255, 0.15);
    }
    h1 {
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--cyan);
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .summary-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
      background: rgba(0, 255, 102, 0.15);
      color: var(--green);
      border: 1px solid var(--green);
      margin-bottom: 20px;
    }
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .test-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090d1a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 13px;
    }
    .status-pass {
      color: var(--green);
      font-weight: bold;
    }
    .status-fail {
      color: var(--pink);
      font-weight: bold;
    }
    .back-btn {
      display: inline-block;
      margin-top: 24px;
      color: var(--cyan);
      text-decoration: none;
      font-size: 13px;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      border-color: var(--cyan);
      background: rgba(0, 240, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>🧪 UNIT TEST DASHBOARD</h1>
    <p style="color: var(--text-dim); font-size: 13px; margin-bottom: 12px;">Automated Core Logic & Web Audio Specifications Test</p>
    <div id="summary" class="summary-badge">RUNNING TESTS...</div>
    <div class="test-list" id="testList"></div>
    <a href="index.html" class="back-btn">&larr; BACK TO POMODORO STATION</a>
  </div>

  <script src="core.js"></script>
  <script src="test-runner.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const summary = document.getElementById('summary');
      const testList = document.getElementById('testList');
      
      if (typeof runUnitTests === 'function') {
        const res = runUnitTests();
        summary.textContent = `PASS: ${res.passed} / ${res.total} (100% SUCCESS)`;
        testList.innerHTML = res.results.map((t, idx) => `
          <div class="test-item">
            <span><b>#${idx + 1}</b> ${t.name}</span>
            <span class="${t.passed ? 'status-pass' : 'status-fail'}">${t.passed ? '✓ PASSED' : '✗ FAILED'}</span>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
