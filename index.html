<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070913">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <title>CYBERPUNK FOCUS // POMODORO STATION</title>
  <style>
    :root {
      --bg: #070913;
      --panel: #0d1224;
      --border: #1f294d;
      --cyan: #00f0ff;
      --pink: #ff0055;
      --yellow: #ffe600;
      --green: #00ff66;
      --text: #e2edff;
      --text-dim: #8fa2c4; /* WCAG AA compliant contrast (>4.5:1 on dark background) */
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12), transparent 60%),
        linear-gradient(rgba(31, 41, 77, 0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 41, 77, 0.25) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    button, .btn, .mode-tab, .sound-btn, .volume-slider {
      touch-action: manipulation;
    }

    /* Cyberpunk HUD Frame */
    .station-container {
      width: 100%;
      max-width: 640px;
      background: rgba(13, 18, 36, 0.85);
      border: 1px solid var(--border);
      border-top: 3px solid var(--cyan);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(12px);
      position: relative;
    }
    .station-container::before {
      content: "SYS_VER // 2.5.00 // FOCUS_MATRIX";
      position: absolute;
      top: -12px;
      left: 20px;
      background: var(--bg);
      padding: 2px 10px;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--cyan);
      border: 1px solid var(--border);
      border-radius: 2px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .glitch-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--text);
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }
    .status-badge {
      font-size: 11px;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(0, 255, 102, 0.1);
      color: var(--green);
      border: 1px solid rgba(0, 255, 102, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Mode Selector Tabs */
    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(7, 9, 19, 0.6);
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .mode-tab {
      flex: 1;
      padding: 8px 10px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: clamp(11px, 2.8vw, 13px);
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
      text-align: center;
      font-family: inherit;
    }
    .mode-tab.active {
      background: var(--cyan);
      color: #070913;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }

    /* Timer Display (Responsive) */
    .timer-circle-wrapper {
      position: relative;
      width: min(250px, 70vw);
      height: min(250px, 70vw);
      margin: 0 auto 24px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .progress-ring {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    .progress-ring-bg {
      fill: none;
      stroke: rgba(31, 41, 77, 0.5);
      stroke-width: 8;
    }
    .progress-ring-fill {
      fill: none;
      stroke: var(--cyan);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 691.15;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
      filter: drop-shadow(0 0 8px var(--cyan));
    }
    .progress-ring-fill.no-anim {
      transition: none !important;
    }
    .timer-content {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .time-digits {
      font-size: clamp(36px, 12vw, 52px);
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--text);
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
      font-variant-numeric: tabular-nums;
    }
    .session-info-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .session-info {
      font-size: clamp(10px, 2.5vw, 12px);
      letter-spacing: 2px;
      color: var(--text-dim);
      text-transform: uppercase;
      text-align: center;
    }
    .reset-cycle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reset-cycle-btn:hover {
      border-color: var(--pink);
      color: var(--pink);
    }

    /* Action Buttons */
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      text-transform: uppercase;
      font-family: inherit;
      min-width: 90px;
    }
    .btn-primary {
      background: var(--cyan);
      color: #070913;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .btn-primary:hover {
      background: #33f3ff;
      box-shadow: 0 0 22px rgba(0, 240, 255, 0.7);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--text-dim);
    }
    .btn-secondary:hover {
      border-color: var(--cyan);
      color: var(--text);
    }
    .btn-secondary.confirming {
      border-color: var(--pink);
      color: var(--pink);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    /* Hotkey Bar */
    .hotkey-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .hotkey-tag {
      background: #10162a;
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 3px;
      color: var(--cyan);
      font-weight: bold;
    }

    /* Ambient Sound Deck */
    .deck-section {
      background: rgba(7, 9, 19, 0.5);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .deck-title {
      font-size: 12px;
      letter-spacing: 1.5px;
      color: var(--cyan);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    .mute-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      border-radius: 3px;
      transition: color 0.2s;
    }
    .mute-btn:hover {
      color: var(--cyan);
    }
    .volume-slider {
      width: 80px;
      accent-color: var(--cyan);
      cursor: pointer;
    }
    .vol-num {
      font-size: 10px;
      width: 32px;
      color: var(--cyan);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .sound-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .sound-btn {
      background: #10162a;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 10px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .sound-btn span { font-size: 16px; }
    .sound-btn.playing {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    /* Target Mission / Task Input */
    .mission-input-row {
      display: flex;
      gap: 8px;
      position: relative;
    }
    .mission-input {
      flex: 1;
      background: #090d1a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 32px 8px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .mission-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }
    .mission-input.saved {
      border-color: var(--green);
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
    }
    .clear-mission-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
    }
    .clear-mission-btn:hover {
      color: var(--cyan);
    }
  </style>
</head>
<body>
  <div class="station-container">
    <div class="header-row">
      <div class="glitch-title">⚡ CYBERPUNK FOCUS</div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="systemStatus" aria-live="polite">ONLINE // READY</span>
      </div>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="mode-tabs" role="tablist" aria-label="โหมดจับเวลา">
      <button class="mode-tab active" data-mode="focus" data-time="1500" role="tab" aria-selected="true" aria-label="โฟกัส 25 นาที">FOCUS (25M)</button>
      <button class="mode-tab" data-mode="shortBreak" data-time="300" role="tab" aria-selected="false" aria-label="พักสั้น 5 นาที">SHORT (5M)</button>
      <button class="mode-tab" data-mode="longBreak" data-time="900" role="tab" aria-selected="false" aria-label="พักยาว 15 นาที">LONG (15M)</button>
    </div>

    <!-- Timer Ring -->
    <div class="timer-circle-wrapper">
      <svg class="progress-ring" viewBox="0 0 250 250" aria-hidden="true">
        <circle class="progress-ring-bg" cx="125" cy="125" r="110" />
        <circle class="progress-ring-fill" id="progressFill" cx="125" cy="125" r="110" />
      </svg>
      <div class="timer-content">
        <div class="time-digits" id="timeDisplay" role="timer" aria-live="polite" aria-atomic="true">25:00</div>
        <div class="session-info-row">
          <div class="session-info" id="sessionLabel">SESSION 01 // DEEP WORK</div>
          <button class="reset-cycle-btn" id="resetCycleBtn" title="รีเซ็ตรอบกลับเป็น 01" aria-label="รีเซ็ตรอบกลับเป็น 01">↺ 01</button>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="btn-row">
      <button class="btn btn-secondary" id="resetBtn" aria-label="รีเซ็ตเวลา">RESET</button>
      <button class="btn btn-primary" id="toggleBtn" aria-label="เริ่มหรือหยุดตัวจับเวลา">START</button>
      <button class="btn btn-secondary" id="skipBtn" aria-label="ข้ามไปยังรอบถัดไป">SKIP &gt;&gt;</button>
    </div>

    <!-- Hotkey Info -->
    <div class="hotkey-hint">
      <span class="hotkey-tag">Space</span> Start/Pause &nbsp;•&nbsp; 
      <span class="hotkey-tag">R</span> Reset &nbsp;•&nbsp; 
      <span class="hotkey-tag">S</span> Skip &nbsp;•&nbsp; 
      <span class="hotkey-tag">M</span> Mute
    </div>

    <!-- Ambient Sound Deck (Synthetic Web Audio) -->
    <div class="deck-section">
      <div class="deck-title">
        <span>🎧 NEURAL AMBIENT GENERATOR</span>
        <div class="volume-control">
          <button class="mute-btn" id="muteBtn" title="เปิด/ปิดเสียง (M)" aria-label="เปิดหรือปิดเสียง">🔊</button>
          <span>VOL</span>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" aria-label="ระดับเสียงบรรยากาศ">
          <span class="vol-num" id="volumePercent">50%</span>
        </div>
      </div>
      <div class="sound-grid">
        <button class="sound-btn" data-sound="rain" aria-label="เปิดเสียง Cyber Rain" aria-pressed="false">
          <span>🌧️</span>
          <b>Cyber Rain</b>
        </button>
        <button class="sound-btn" data-sound="engine" aria-label="เปิดเสียง Deep Space Hum" aria-pressed="false">
          <span>🚀</span>
          <b>Deep Space Hum</b>
        </button>
        <button class="sound-btn" data-sound="binaural" aria-label="เปิดเสียง 40Hz Focus Wave" aria-pressed="false">
          <span>⚡</span>
          <b>40Hz Focus Wave</b>
        </button>
      </div>
    </div>

    <!-- Mission Focus Bar -->
    <div class="deck-section">
      <div class="deck-title">🎯 CURRENT MISSION OBJECTIVE</div>
      <div class="mission-input-row">
        <input type="text" class="mission-input" id="missionInput" maxlength="80" placeholder="ระบุภารกิจหรือเป้าหมายที่ต้องการโฟกัส..." value="สร้างสรรค์โปรเจกต์ระดับเทพ" autocomplete="off" aria-label="ระบุภารกิจที่กำลังโฟกัส">
        <button class="clear-mission-btn" id="clearMissionBtn" title="ล้างข้อความ" aria-label="ล้างข้อความภารกิจ">✕</button>
      </div>
    </div>
  </div>

  <script>
    // Web Audio Synthesizer Engine (Zero external dependencies)
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let masterGain = null;
    let masterCompressor = null;
    let cachedRainBuffer = null;
    let activeNodes = { rain: null, engine: null, binaural: null };
    let savedVol = parseFloat(localStorage.getItem('cp_volume') || '0.5');
    if (isNaN(savedVol) || savedVol < 0 || savedVol > 1) savedVol = 0.5;
    let isMuted = localStorage.getItem('cp_muted') === 'true';
    let isProcessingToggle = false;
    let audioInitLock = false;
    let resetConfirmTimer = null;

    function safeDisconnect(node) {
      if (!node) return;
      try { node.disconnect(); } catch (e) {}
    }

    async function ensureAudio() {
      if (audioInitLock) return;
      if (!audioCtx) {
        audioInitLock = true;
        try {
          audioCtx = new AudioContextClass();
          masterCompressor = audioCtx.createDynamicsCompressor();
          masterCompressor.threshold.setValueAtTime(-18, audioCtx.currentTime);
          masterCompressor.knee.setValueAtTime(30, audioCtx.currentTime);
          masterCompressor.ratio.setValueAtTime(12, audioCtx.currentTime);
          masterCompressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
          masterCompressor.release.setValueAtTime(0.25, audioCtx.currentTime);

          masterGain = audioCtx.createGain();
          masterGain.gain.setValueAtTime(isMuted ? 0 : savedVol, audioCtx.currentTime);

          masterCompressor.connect(masterGain);
          masterGain.connect(audioCtx.destination);
        } finally {
          audioInitLock = false;
        }
      }
      if (audioCtx.state === 'suspended') {
        try {
          await audioCtx.resume();
        } catch (e) {}
      }
    }

    const volumeSlider = document.getElementById('volumeSlider');
    const muteBtn = document.getElementById('muteBtn');
    const volumePercent = document.getElementById('volumePercent');

    function updateVolumeDisplay(vol) {
      if (volumePercent) {
        const pct = isMuted ? 0 : Math.round(vol * 100);
        volumePercent.textContent = `${pct}%`;
      }
      if (muteBtn) {
        muteBtn.textContent = (isMuted || vol === 0) ? '🔇' : '🔊';
      }
    }
    updateVolumeDisplay(savedVol);

    if (volumeSlider) {
      volumeSlider.value = isMuted ? 0 : savedVol;
      volumeSlider.addEventListener('input', async (e) => {
        await ensureAudio();
        const vol = parseFloat(e.target.value);
        savedVol = vol;
        isMuted = (vol === 0);
        localStorage.setItem('cp_muted', String(isMuted));
        localStorage.setItem('cp_volume', String(vol));
        updateVolumeDisplay(vol);
        if (masterGain) {
          masterGain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.03);
        }
      });
    }

    async function toggleMute() {
      await ensureAudio();
      isMuted = !isMuted;
      localStorage.setItem('cp_muted', String(isMuted));
      const targetVol = isMuted ? 0 : (savedVol > 0 ? savedVol : 0.5);
      if (!isMuted && savedVol === 0) savedVol = 0.5;
      if (masterGain) {
        masterGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.03);
      }
      if (volumeSlider) volumeSlider.value = targetVol;
      updateVolumeDisplay(targetVol);
    }

    if (muteBtn) {
      muteBtn.addEventListener('click', toggleMute);
    }

    async function toggleSound(type, btn) {
      await ensureAudio();
      if (activeNodes[type]) {
        try { activeNodes[type].stop(); } catch (e) {}
        activeNodes[type] = null;
        btn.classList.remove('playing');
        btn.setAttribute('aria-pressed', 'false');
        return;
      }

      try {
        btn.classList.add('playing');
        btn.setAttribute('aria-pressed', 'true');
        if (type === 'rain') {
          // Efficient buffer caching: generate 2s buffer once
          if (!cachedRainBuffer) {
            const bufferSize = audioCtx.sampleRate * 2;
            cachedRainBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = cachedRainBuffer.getChannelData(0);
            let b0 = 0, b1 = 0;
            for (let i = 0; i < bufferSize; i++) {
              const white = Math.random() * 2 - 1;
              b0 = 0.99 * b0 + white * 0.05;
              b1 = 0.95 * b1 + white * 0.1;
              output[i] = (b0 + b1) * 0.8;
            }
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = cachedRainBuffer;
          noise.loop = true;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 1000;

          const gain = audioCtx.createGain();
          gain.gain.value = 0.25;

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(masterCompressor);
          noise.start();
          activeNodes.rain = {
            stop: () => {
              try { noise.stop(); } catch (e) {}
              safeDisconnect(noise);
              safeDisconnect(filter);
              safeDisconnect(gain);
            }
          };
        } else if (type === 'engine') {
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          osc1.type = 'sawtooth';
          osc1.frequency.value = 55; // A1
          osc2.type = 'sine';
          osc2.frequency.value = 110;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 180;

          const gain = audioCtx.createGain();
          gain.gain.value = 0.3;

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(gain);
          gain.connect(masterCompressor);

          osc1.start();
          osc2.start();
          activeNodes.engine = {
            stop: () => {
              try { osc1.stop(); osc2.stop(); } catch (e) {}
              safeDisconnect(osc1);
              safeDisconnect(osc2);
              safeDisconnect(filter);
              safeDisconnect(gain);
            }
          };
        } else if (type === 'binaural') {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = 216;

          const mod = audioCtx.createOscillator();
          mod.type = 'sine';
          mod.frequency.value = 40; // 40Hz modulation
          const modGain = audioCtx.createGain();
          modGain.gain.value = 10;
          mod.connect(modGain);
          modGain.connect(osc.frequency);

          const gain = audioCtx.createGain();
          gain.gain.value = 0.2;
          osc.connect(gain);
          gain.connect(masterCompressor);

          osc.start();
          mod.start();
          activeNodes.binaural = {
            stop: () => {
              try { osc.stop(); mod.stop(); } catch (e) {}
              safeDisconnect(osc);
              safeDisconnect(mod);
              safeDisconnect(modGain);
              safeDisconnect(gain);
            }
          };
        }
      } catch (err) {
        btn.classList.remove('playing');
        btn.setAttribute('aria-pressed', 'false');
        activeNodes[type] = null;
      }
    }

    async function playBeep(modeType = 'focus_end') {
      await ensureAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';

        if (modeType === 'focus_end') {
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(masterCompressor || audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        } else {
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(masterCompressor || audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        }
      } catch (e) {}
    }

    function notifySessionComplete(title, bodyText) {
      try {
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification(title, {
            body: bodyText,
            icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>",
            tag: 'cyberpunk-pomodoro'
          });
        }
      } catch (e) {}
    }

    // Pomodoro Timer Logic
    const CIRCUMFERENCE = 2 * Math.PI * 110; // r=110 -> 691.15
    const progressFill = document.getElementById('progressFill');
    const timeDisplay = document.getElementById('timeDisplay');
    const sessionLabel = document.getElementById('sessionLabel');
    const resetCycleBtn = document.getElementById('resetCycleBtn');
    const systemStatus = document.getElementById('systemStatus');
    const toggleBtn = document.getElementById('toggleBtn');
    const resetBtn = document.getElementById('resetBtn');
    const skipBtn = document.getElementById('skipBtn');
    const modeTabs = document.querySelectorAll('.mode-tab');
    const soundBtns = document.querySelectorAll('.sound-btn');
    const missionInput = document.getElementById('missionInput');
    const clearMissionBtn = document.getElementById('clearMissionBtn');

    progressFill.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;

    let savedMission = localStorage.getItem('cp_mission');
    if (savedMission !== null) {
      missionInput.value = savedMission;
    }
    missionInput.addEventListener('input', (e) => {
      localStorage.setItem('cp_mission', e.target.value);
    });
    missionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        missionInput.blur();
        missionInput.classList.add('saved');
        setTimeout(() => { missionInput.classList.remove('saved'); }, 600);
      }
    });

    if (clearMissionBtn) {
      clearMissionBtn.addEventListener('click', () => {
        missionInput.value = '';
        localStorage.removeItem('cp_mission');
        missionInput.focus();
      });
    }

    let currentDuration = 1500;
    let timeLeft = 1500;
    let isRunning = false;
    let timerId = null;
    let targetEndTime = null;
    let currentMode = 'focus';
    let cycleCount = parseInt(localStorage.getItem('cp_cycle') || '1', 10);
    if (isNaN(cycleCount) || cycleCount < 1) cycleCount = 1;

    function updateDisplay(withAnim = true) {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timeDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (!withAnim) {
        progressFill.classList.add('no-anim');
      } else {
        progressFill.classList.remove('no-anim');
      }

      const offset = CIRCUMFERENCE - (timeLeft / currentDuration) * CIRCUMFERENCE;
      progressFill.style.strokeDashoffset = offset;
      progressFill.style.opacity = (timeLeft === currentDuration) ? '0' : '1';

      if (!withAnim) {
        requestAnimationFrame(() => {
          progressFill.classList.remove('no-anim');
        });
      }

      const statePrefix = isRunning ? '' : '[PAUSED] ';
      document.title = `${statePrefix}(${timeDisplay.textContent}) CYBERPUNK FOCUS`;
    }

    function setMode(mode, duration) {
      currentMode = mode;
      currentDuration = duration;
      timeLeft = duration;
      isRunning = false;
      clearInterval(timerId);
      timerId = null;
      toggleBtn.textContent = 'START';
      systemStatus.textContent = 'ONLINE // READY';

      if (resetConfirmTimer) {
        clearTimeout(resetConfirmTimer);
        resetConfirmTimer = null;
        resetBtn.textContent = 'RESET';
        resetBtn.classList.remove('confirming');
      }

      if (mode !== 'focus' && activeNodes.binaural) {
        const binauralBtn = document.querySelector('.sound-btn[data-sound="binaural"]');
        if (binauralBtn) toggleSound('binaural', binauralBtn);
      }

      modeTabs.forEach(t => {
        const isActive = t.dataset.mode === mode;
        t.classList.toggle('active', isActive);
        t.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });

      if (mode === 'focus') {
        progressFill.style.stroke = 'var(--cyan)';
        const formattedCycle = String(cycleCount).padStart(2, '0');
        sessionLabel.textContent = `SESSION ${formattedCycle} // DEEP WORK`;
      } else if (mode === 'shortBreak') {
        progressFill.style.stroke = 'var(--green)';
        sessionLabel.textContent = 'RECHARGE // SHORT BREAK';
      } else {
        progressFill.style.stroke = 'var(--pink)';
        sessionLabel.textContent = 'REST // LONG BREAK';
      }
      updateDisplay(false);
    }

    function handleTimerComplete() {
      clearInterval(timerId);
      timerId = null;
      isRunning = false;
      toggleBtn.textContent = 'START';

      if (currentMode === 'focus') {
        playBeep('focus_end');
        notifySessionComplete('FOCUS COMPLETE // CYBERPUNK POMODORO', `จบ Session ${cycleCount} เรียบร้อยแล้ว ได้เวลาพักผ่อน!`);
        if (cycleCount % 4 === 0) {
          cycleCount++;
          localStorage.setItem('cp_cycle', String(cycleCount));
          setMode('longBreak', 900);
        } else {
          cycleCount++;
          localStorage.setItem('cp_cycle', String(cycleCount));
          setMode('shortBreak', 300);
        }
      } else {
        playBeep('break_end');
        notifySessionComplete('BREAK FINISHED // BACK TO MATRIX', 'หมดเวลาพักแล้ว พร้อมกลับมาลุยภารกิจต่อหรือยัง?');
        setMode('focus', 1500);
      }
    }

    async function toggleTimer() {
      if (isProcessingToggle) return;
      isProcessingToggle = true;

      try {
        await ensureAudio();
        if ('Notification' in window && Notification.permission === 'default') {
          try {
            Notification.requestPermission();
          } catch (e) {}
        }

        if (isRunning) {
          isRunning = false;
          clearInterval(timerId);
          timerId = null;
          toggleBtn.textContent = 'RESUME';
          systemStatus.textContent = 'SYSTEM // PAUSED';
          updateDisplay(false);
        } else {
          isRunning = true;
          toggleBtn.textContent = 'PAUSE';
          systemStatus.textContent = 'SYSTEM // RUNNING';
          targetEndTime = Date.now() + timeLeft * 1000;
          updateDisplay(true);

          timerId = setInterval(() => {
            const remaining = Math.max(0, Math.round((targetEndTime - Date.now()) / 1000));
            if (remaining !== timeLeft || remaining === 0) {
              timeLeft = remaining;
              updateDisplay(true);
              if (timeLeft <= 0) {
                handleTimerComplete();
              }
            }
          }, 250);
        }
      } finally {
        isProcessingToggle = false;
      }
    }

    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        setMode(tab.dataset.mode, parseInt(tab.dataset.time, 10));
      });
    });

    toggleBtn.addEventListener('click', toggleTimer);

    // Accidental Reset Guard: Require 2 clicks if timer is running
    function handleResetAction() {
      if (isRunning && !resetConfirmTimer) {
        resetBtn.textContent = 'CONFIRM?';
        resetBtn.classList.add('confirming');
        resetConfirmTimer = setTimeout(() => {
          resetBtn.textContent = 'RESET';
          resetBtn.classList.remove('confirming');
          resetConfirmTimer = null;
        }, 2500);
        return;
      }
      if (resetConfirmTimer) {
        clearTimeout(resetConfirmTimer);
        resetConfirmTimer = null;
        resetBtn.textContent = 'RESET';
        resetBtn.classList.remove('confirming');
      }
      setMode(currentMode, currentDuration);
    }

    resetBtn.addEventListener('click', handleResetAction);

    skipBtn.addEventListener('click', () => {
      if (currentMode === 'focus') {
        setMode('shortBreak', 300);
      } else {
        setMode('focus', 1500);
      }
    });

    resetCycleBtn.addEventListener('click', () => {
      cycleCount = 1;
      localStorage.setItem('cp_cycle', '1');
      const formattedCycle = String(cycleCount).padStart(2, '0');
      if (currentMode === 'focus') {
        sessionLabel.textContent = `SESSION ${formattedCycle} // DEEP WORK`;
      }
      playBeep('break_end');
      const origText = resetCycleBtn.textContent;
      resetCycleBtn.textContent = 'DONE!';
      setTimeout(() => { resetCycleBtn.textContent = origText; }, 1200);
    });

    soundBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        toggleSound(btn.dataset.sound, btn);
      });
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === missionInput) return;

      if (e.code === 'Space') {
        e.preventDefault();
        toggleTimer();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        handleResetAction();
      } else if (e.key === 's' || e.key === 'S') {
        e.preventDefault();
        skipBtn.click();
      } else if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        toggleMute();
      }
    });

    updateDisplay(false);
  </script>
</body>
</html>
